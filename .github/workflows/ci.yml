name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, tests, and plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: lib/package-lock.json
      - run: npm ci
      - name: Validate plugin source
        run: npm run validate:plugin
      - name: Test validator failure cases
        run: npm run test:validator
      - name: Build and run regression tests
        run: npm test
      - name: Test factory dispatcher
        working-directory: factory
        run: python3 -m unittest -v test_factory_next
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test built runtime through Bubble adapters in real browsers
        run: npx playwright test
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: lib/test-results
          retention-days: 7
